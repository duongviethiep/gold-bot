name: XAUUSD Hourly Gold Bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Chế độ chạy: auto (mỗi giờ), poll (mỗi phút: cập nhật lệnh + đọc /check), check (báo cáo lệnh ngay)'
        required: false
        default: 'auto'

# Các lần chạy xếp hàng nối đuôi nhau, không chạy song song,
# để tránh 2 run cùng ghi daily_trades.json và đụng nhau khi git push.
concurrency:
  group: gold-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Gold Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: |
          python gold_bot.py

      - name: Commit and Push Updated Journal
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add daily_trades.json
          if [ -f trade_journal.csv ]; then git add trade_journal.csv; fi
          if git diff --staged --quiet; then
            echo "Không có thay đổi nhật ký lệnh, bỏ qua commit."
          else
            git commit -m "chore: update trades state and journal [skip ci]"
            git pull --rebase origin main
            git push
          fi
