name: XAUUSD Hourly Gold Bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Chế độ chạy: auto (định kỳ), check (báo cáo lệnh ngay), poll (quét lệnh /check từ Telegram)'
        required: false
        default: 'auto'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Gold Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: |
          python gold_bot.py

      - name: Commit and Push Updated Journal
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add daily_trades.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update daily trades journal [skip ci]" && git push)
