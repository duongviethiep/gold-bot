name: Auto Gold Bot

on:
 
  workflow_dispatch: # Nút bấm chạy thử thủ công

jobs:
  run-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Tai ma nguon
        uses: actions/checkout@v4

      - name: Cai dat Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cai dat thu vien
        run: pip install requests tradingview-ta

      - name: Chay bao cao gia vang
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Lay thu trong tuan (0: Chu Nhat, 1: Thu 2, ..., 6: Thu 7) va gio theo UTC
          DAY_OF_WEEK=$(date -u +"%w")
          HOUR_UTC=$(date -u +"%H")

          # KIEM TRA GIO MO CUA THI TRUONG VANG:
          # Dong cua: Tu 22h UTC Thu 6 (05h sang Thu 7 gio VN) den 22h UTC Chu Nhat (05h sang Thu 2 gio VN)
          if [ "$DAY_OF_WEEK" -eq 6 ]; then
            echo "Thu 7 (gio UTC) - Thi truong dong cua. Bo qua."
            exit 0
          fi

          if [ "$DAY_OF_WEEK" -eq 0 ] && [ "$HOUR_UTC" -lt 22 ]; then
            echo "Chu Nhat truoc 22h UTC - Thi truong chua mo cua. Bo qua."
            exit 0
          fi

          if [ "$DAY_OF_WEEK" -eq 5 ] && [ "$HOUR_UTC" -ge 22 ]; then
            echo "Sau 22h UTC Thu 6 - Thi truong da dong cua cuoi tuan. Bo qua."
            exit 0
          fi

          # Chay khung 4H neu trung gio dong nen (01, 05, 09, 13, 17, 21 UTC)
          if [ "$HOUR_UTC" = "01" ] || [ "$HOUR_UTC" = "05" ] || [ "$HOUR_UTC" = "09" ] || [ "$HOUR_UTC" = "13" ] || [ "$HOUR_UTC" = "17" ] || [ "$HOUR_UTC" = "21" ]; then
            python gold_bot.py 4H
          fi

          # Luon chay khung 1H moi dau gio
          python gold_bot.py 1H
