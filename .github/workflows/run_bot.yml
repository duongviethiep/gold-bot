name: Auto Gold Bot

on:
  workflow_dispatch:

jobs:
  run-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Tai ma nguon
        uses: actions/checkout@v4

      - name: Cai dat Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cai dat thu vien
        run: pip install requests tradingview-ta

      - name: Chay bao cao gia vang
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          HOUR_UTC=$(date -u +"%H")
          # Chay khung 4H neu trung gio dong nen (01, 05, 09, 13, 17, 21 UTC)
          if [ "$HOUR_UTC" = "01" ] || [ "$HOUR_UTC" = "05" ] || [ "$HOUR_UTC" = "09" ] || [ "$HOUR_UTC" = "13" ] || [ "$HOUR_UTC" = "17" ] || [ "$HOUR_UTC" = "21" ]; then
            python gold_bot.py 4H
          fi
          # Luon chay khung 1H moi dau gio (va tu dong gui tong ket ngay luc 22h UTC / 05h sang VN)
          python gold_bot.py 1H

      - name: Luu nhat ky lenh trong ngay
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add daily_trades.json || true
          git commit -m "Auto update daily trade log [skip ci]" || exit 0
          git push || true
